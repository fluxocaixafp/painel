<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213d"><title>Painel Financeiro da Loja</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f3f1ec;--card:#fff;--ink:#14213d;--mut:#6b7280;--line:#e2ded4;--gold:#a8741a;--ok:#2f7d5b;--bad:#b3392f;--blue:#14213d}
@media(prefers-color-scheme:dark){:root{--bg:#0d1526;--card:#16213a;--ink:#eef0f5;--mut:#9aa6bd;--line:#26334f;--gold:#d9a441;--ok:#4cc38a;--bad:#ff6b5e;--blue:#7da2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Georgia,'Times New Roman',serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{padding:22px 16px 8px;max-width:1100px;margin:auto}h1{margin:0;font-size:1.5rem;letter-spacing:.2px}
.sub{color:var(--mut);font:13px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:8px 16px 40px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.charts{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.k{border-top:3px solid var(--gold)}
.k small{display:block;color:var(--mut);font:12px system-ui,sans-serif}.k b{font-size:1.45rem;font-variant-numeric:tabular-nums}.k i{font:12px system-ui,sans-serif;color:var(--mut);font-style:normal}
.neg{color:var(--bad)}.pos{color:var(--ok)}h2{font-size:1rem;margin:0 0 8px}.cv{position:relative;height:260px}
table{width:100%;border-collapse:collapse;font:14px system-ui,sans-serif}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}td:last-child,th:last-child{text-align:right}
input,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}button{background:var(--blue);color:var(--bg);cursor:pointer}
.wide{grid-column:1/-1}.alerta{border-left:4px solid var(--bad)}
</style></head><body>
<header><h1>Painel Financeiro da Loja</h1><div class="sub" id="sub"></div></header>
<main>
<div class="grid" id="kpis"></div>
<div class="alerta card" id="alerta" style="margin-top:12px"></div>
<div class="grid charts">
<div class="card wide"><h2>Entradas × Saídas e saldo acumulado</h2><div class="cv"><canvas id="c1"></canvas></div></div>
<div class="card"><h2>Mensalidades: arrecadado × potencial</h2><div class="cv"><canvas id="c2"></canvas></div></div>
<div class="card"><h2>Para onde vai o dinheiro (acumulado)</h2><div class="cv"><canvas id="c3"></canvas></div></div>
<div class="card"><h2>Inadimplência por grau</h2><div class="cv"><canvas id="c4"></canvas></div></div>
<div class="card"><h2>Projeção de saldo até Mai</h2><div class="cv"><canvas id="c5"></canvas></div><div class="sub" id="projnote"></div></div>
<div class="card"><h2>Iniciação e elevação</h2><table id="rec"></table></div>
<div class="card"><h2>Despesas maçônicas por item</h2><table id="dm"></table></div>
<div class="card wide"><h2>Irmãos em atraso (acesso restrito)</h2><div id="lock"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"> <button id="go">Ver lista</button> <span class="sub" id="msg"></span></div><table id="dev"></table></div>
</div></main>
<script>
const R=v=>(v<0?'-':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{maximumFractionDigits:0}),$=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
fetch('data.json').then(r=>r.json()).then(d=>{
const n=d.idx_ref,M=d.meses.slice(0,n),f=d.fluxo,m=d.mensalidades,s=(a)=>a.slice(0,n).reduce((x,y)=>x+y,0);
const ent=s(f.total_entradas),sai=s(f.total_saidas),res=ent-sai,saldo=f.saldo_final[n-1],medio=res/n;
const arr=s(m.arrecadado),pot=m.potencial*n,taxa=arr/pot,inad=m.inadimplentes/m.cadastrados;
$('sub').textContent=`Exercício ${d.ano} · dados até ${d.mes_ref} · atualizado em ${d.atualizado}`;
const K=(t,v,c,i)=>`<div class="card k"><small>${t}</small><b class="${c||''}">${v}</b><i>${i||''}</i></div>`;
$('kpis').innerHTML=K('Saldo em caixa',R(saldo),saldo<0?'neg':'pos','acumulado')+K('Resultado do período',R(res),res<0?'neg':'pos',`média ${R(medio)}/mês`)+
K('Arrecadação de mensalidades',(taxa*100).toFixed(0)+'%',taxa<.8?'neg':'pos',`${R(arr)} de ${R(pot)}`)+K('Inadimplência',(inad*100).toFixed(1)+'%',inad>.15?'neg':'pos',`${m.inadimplentes} de ${m.cadastrados} irmãos`)+
K('Valor em atraso',R(m.valor_devido),'neg',`${m.meses_atraso} mensalidades`)+K('Despesas maçônicas',((s(Object.values(f.saidas).filter((_,i)=>Object.keys(f.saidas)[i]=='Despesas Maçonicas')[0]||[])/sai)*100).toFixed(0)+'%','','das saídas');
$('alerta').innerHTML=`<b>Leitura rápida:</b> o caixa fechou ${M.length} meses com resultado ${res<0?'negativo':'positivo'} de ${R(res)}. Se os ${m.inadimplentes} irmãos em atraso quitassem ${R(m.valor_devido)}, o saldo iria para ${R(saldo+m.valor_devido)}.`;
const ink=css('--ink'),mut=css('--mut'),gold=css('--gold'),ok=css('--ok'),bad=css('--bad'),blue=css('--blue'),line=css('--line');
Chart.defaults.color=mut;Chart.defaults.borderColor=line;Chart.defaults.maintainAspectRatio=false;
const mk=(id,cfg)=>new Chart($(id),cfg),fm={callback:v=>R(v)},tip={callbacks:{label:c=>' '+c.dataset.label+': '+R(c.parsed.y??c.parsed)}};
mk('c1',{data:{labels:M,datasets:[{type:'bar',label:'Entradas',data:f.total_entradas.slice(0,n),backgroundColor:ok},{type:'bar',label:'Saídas',data:f.total_saidas.slice(0,n),backgroundColor:bad},{type:'line',label:'Saldo',data:f.saldo_final.slice(0,n),borderColor:gold,backgroundColor:gold,tension:.3}]},options:{scales:{y:{ticks:fm}},plugins:{tooltip:tip}}});
mk('c2',{type:'bar',data:{labels:M,datasets:[{label:'Arrecadado',data:m.arrecadado.slice(0,n),backgroundColor:blue},{label:'Potencial',data:M.map(_=>m.potencial),backgroundColor:line}]},options:{scales:{y:{ticks:fm}},plugins:{tooltip:tip}}});
const sa=Object.entries(f.saidas).map(([k,v])=>[k,s(v)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
mk('c3',{type:'doughnut',data:{labels:sa.map(x=>x[0]),datasets:[{data:sa.map(x=>x[1]),backgroundColor:[blue,gold,bad,ok,'#8a8fa3','#c9b27c','#5f7aa8']}]},options:{plugins:{legend:{position:'bottom'},tooltip:{callbacks:{label:c=>' '+c.label+': '+R(c.parsed)}}}}});
const g=Object.entries(m.por_grau);
mk('c4',{type:'bar',data:{labels:g.map(x=>x[0]),datasets:[{label:'Irmãos',data:g.map(x=>x[1].total),backgroundColor:line},{label:'Inadimplentes',data:g.map(x=>x[1].inadimplentes),backgroundColor:bad}]}});
const ult=f.saldo_final[n-1],pr=d.meses.map((_,i)=>i<n?f.saldo_final[i]:ult+medio*(i-n+1));
mk('c5',{type:'line',data:{labels:d.meses,datasets:[{label:'Realizado',data:pr.map((v,i)=>i<n?v:null),borderColor:gold,backgroundColor:gold},{label:'Projeção (mantido o ritmo)',data:pr.map((v,i)=>i>=n-1?v:null),borderColor:bad,borderDash:[6,4],pointRadius:0}]},options:{scales:{y:{ticks:fm}},plugins:{tooltip:tip}}});
$('projnote').textContent=`Se o déficit médio de ${R(medio)}/mês continuar, o saldo chega a ${R(pr[11])} em Mai.`;
$('rec').innerHTML='<tr><th>Tipo</th><th>Pago</th><th>Pendente</th></tr>'+Object.entries(d.receitas_especiais).map(([k,v])=>`<tr><td>${k}</td><td>${R(v.pago)}</td><td class="neg">${R(v.pendente)}</td></tr>`).join('');
$('dm').innerHTML=Object.entries(d.despesas_macom).map(([k,v])=>`<tr><td>${k}</td><td>${R(s(v))}</td></tr>`).join('');
});
$('go').onclick=async()=>{try{
const e=await (await fetch('devedores.enc.json')).json(),b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),t=new TextEncoder();
const km=await crypto.subtle.importKey('raw',t.encode($('pw').value),'PBKDF2',false,['deriveKey']);
const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.salt),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
const l=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.iv)},k,b(e.ct))));
$('lock').hidden=true;$('dev').innerHTML='<tr><th>Irmão</th><th>Grau</th><th>Meses</th><th>Devido</th></tr>'+l.map(i=>`<tr><td>${i.nome}</td><td>${i.grau}</td><td>${i.atraso}</td><td>${R(i.devedor)}</td></tr>`).join('');
}catch(x){$('msg').textContent='Senha incorreta ou lista indisponível.'}};
</script></body></html>
